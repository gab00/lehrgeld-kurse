name: Index-Historie holen

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  holen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet "yfinance>=0.2.54"
      - run: python research/index_history.py
      - run: |
          git config user.name "lehrgeld-bot"
          git config user.email "lehrgeld-bot@users.noreply.github.com"
          git add research
          git diff --cached --quiet || { git commit -m "Index-Historie $(date -u +%Y-%m-%d)"; git pull --rebase origin main; git push; }
