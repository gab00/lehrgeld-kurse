name: Tageskurse holen

on:
  schedule:
    # Mo–Fr nach US-Börsenschluss (20:00 UTC Sommerzeit, 21:00 UTC Winterzeit).
    # Drei Läufe, falls GitHub verspätet startet oder Yahoo kurz ausfällt.
    - cron: "20 20 * * 1-5"
    - cron: "20 21 * * 1-5"
    - cron: "50 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kurse
  cancel-in-progress: false

jobs:
  holen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: yfinance installieren
        run: pip install --quiet "yfinance>=0.2.54"
      - name: Kurse holen
        run: python fetch.py
      - name: Änderungen speichern
        run: |
          git config user.name "lehrgeld-bot"
          git config user.email "lehrgeld-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Keine neuen Kurse."
          else
            git commit -m "Kurse $(date -u +%Y-%m-%d)"
            git push
          fi
